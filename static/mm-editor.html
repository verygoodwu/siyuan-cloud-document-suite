<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./MindElixir.css">
  <style>
    html,body,#map{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    #status,#help,#export{position:fixed;z-index:20;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px #0002;color:#667085;font:12px system-ui}
    #status{right:12px;bottom:10px}
    #help{left:12px;top:10px;pointer-events:none}
    #export{right:12px;top:10px;border:0;cursor:pointer;color:#fff;background:#3f73f1}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="help">拖节点：按住节点文字移动　·　移动画布：按住右键拖动　·　编辑：双击节点</div>
  <button id="export" type="button">导出 .mm</button>
  <div id="status">正在加载…</div>
  <script type="module" src="./mm-editor.js"></script>
</body>
</html>
