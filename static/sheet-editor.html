<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:light;--bg:#fff;--panel:#fafafa;--panel-strong:#f5f6f8;--cell-bg:#fff;--text:#202124;--muted:#667085;--border:#e4e7ec;--border-strong:#d0d5dd;--accent:#3478f6;--accent-soft:#edf3ff;--hover:#f8fafc;--shadow:#10182822}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121212;--panel:#191919;--panel-strong:#242424;--cell-bg:#121212;--text:#f3f4f6;--muted:#a7adb8;--border:#33363a;--border-strong:#45494f;--accent:#35c98f;--accent-soft:#153d30;--hover:#1d2422;--shadow:#0008}}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font:13px system-ui;color:var(--text);background:var(--bg)}button,select,input,summary{font:inherit;color:inherit}button,select,input{height:30px;border:1px solid var(--border-strong);border-radius:5px;background:var(--cell-bg);padding:4px 8px}button{cursor:pointer}button:disabled{cursor:default;opacity:.4}button.danger{color:#e5484d}#app{height:100%;display:flex;flex-direction:column;background:var(--bg)}#app:not(.edit-mode) .edit-only{display:none!important}
    .sheet-head{height:42px;display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--border);background:var(--panel)}.document-name{display:none}.mode-label{padding:2px 7px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}#status{margin-left:auto;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#status[data-state="working"]{color:var(--accent)}#status[data-state="saved"]{color:#2f9e44}#status[data-state="error"]{color:#d97706}#mode-toggle{min-width:76px;border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
    .commandbar{min-height:42px;display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);background:var(--panel);overflow-x:auto;overflow-y:hidden;white-space:nowrap}.tool-group{display:flex;align-items:center;gap:3px;padding-right:5px;margin-right:2px;border-right:1px solid var(--border)}.tool-group:last-child{border-right:0}.icon-button,.tool-menu>summary{display:flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:4px 7px;border:1px solid transparent;border-radius:5px;background:transparent;cursor:pointer;list-style:none;font-weight:600}.tool-menu>summary::-webkit-details-marker{display:none}.icon-button:hover,.tool-menu>summary:hover,.icon-button.active,.tool-menu[open]>summary{border-color:var(--border-strong);background:var(--panel-strong)}.icon-button:focus-visible,.tool-menu>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}.icon-button.active{color:var(--accent)}.toolbar-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-icon{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-chevron{width:8px;height:8px;margin-left:3px;fill:currentColor}.compact-select{max-width:104px;border-color:transparent;background:transparent}.color-tool{display:flex;align-items:center;gap:3px;height:30px;padding:2px 5px;border-radius:5px}.color-tool:hover{background:var(--panel-strong)}.color-tool input{width:20px;height:18px;padding:0;border:0;background:transparent}.tool-menu{position:relative}.menu-pop{position:fixed;z-index:40;display:flex;flex-direction:column;gap:3px;min-width:142px;margin-top:4px;padding:7px;border:1px solid var(--border-strong);border-radius:8px;background:var(--cell-bg);box-shadow:0 8px 24px var(--shadow)}.menu-pop button{display:flex;align-items:center;gap:9px;border:0;text-align:left;background:transparent}.menu-pop button:hover,.menu-pop button:focus-visible{background:var(--panel-strong);outline:0}.menu-pop button[aria-checked="true"]{color:var(--accent);background:var(--accent-soft)}.menu-pop button[aria-checked="true"]::after{content:"✓";margin-left:auto}.menu-pop .filter-input{width:180px}.wide-menu{min-width:198px}
    .formula-row{height:36px;display:flex;align-items:center;padding:3px 8px;border-bottom:1px solid var(--border);background:var(--panel)}.formula-wrap{display:flex;align-items:center;flex:1;min-width:230px}.formula-wrap input{height:28px;padding:4px 8px;border-color:var(--border-strong);background:var(--cell-bg);outline:0}.formula-wrap input:focus{border-color:var(--accent)}.name-box{width:78px;border-radius:5px 0 0 5px;text-align:center;color:var(--muted)}.formula-input{flex:1;border-left:0!important;border-radius:0 5px 5px 0}.fx{height:28px;padding:5px 8px;border-block:1px solid var(--border-strong);background:var(--cell-bg);color:var(--muted);font-style:italic}.formula-suggestion-menu{position:fixed;z-index:70;display:flex;flex-direction:column;max-height:240px;overflow:auto;padding:5px;border:1px solid var(--border-strong);border-radius:7px;background:var(--cell-bg);box-shadow:0 8px 24px var(--shadow)}.formula-suggestion-menu[hidden]{display:none!important}.formula-suggestion-menu button{display:grid;grid-template-columns:92px 1fr;gap:9px;height:auto;min-height:31px;border:0;text-align:left;background:transparent}.formula-suggestion-menu button:hover,.formula-suggestion-menu button.active{background:var(--accent-soft);color:var(--accent)}.formula-suggestion-menu small{color:var(--muted)}
    .search-panel{position:absolute;z-index:35;top:90px;right:10px;width:380px;padding:12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--cell-bg);box-shadow:0 10px 28px var(--shadow)}.search-head{display:flex;align-items:center;margin-bottom:8px;font-weight:650}.search-head button{margin-left:auto;border:0;background:transparent}.find-wrap{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:7px}.find-wrap>input{grid-column:1/-1;width:100%;outline:0}.find-wrap input:focus{border-color:var(--accent)}.find-wrap button{min-width:58px;white-space:nowrap}.find-count{min-width:40px;color:var(--muted);text-align:left}.replace-wrap{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:8px}.replace-wrap input{min-width:0}.search-options{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;color:var(--muted);font-size:12px}.search-options label{display:flex;align-items:center;gap:4px}.search-options input{width:14px;height:14px;margin:0}.formula-help{height:20px;padding:2px 10px;border-bottom:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:12px}.formula-help[hidden]{display:none!important}
    .grid-wrap{flex:1;overflow:auto;position:relative}#app:not(.edit-mode) #grid{user-select:auto}table{border:0;border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--cell-bg)}th,td{height:28px;padding:4px 6px;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);white-space:pre;overflow:hidden}td.text-flow-wrap{height:auto;min-height:28px;white-space:normal;overflow-wrap:anywhere}td.text-flow-overflow{overflow:visible;position:relative;background:var(--cell-bg)}tr>:last-child{border-right:0}tbody tr:last-child>*{border-bottom:0}td:hover{background:var(--hover)}td.range-selected{background:var(--accent-soft)}td.selection-top{border-top:2px solid var(--accent)}td.selection-right{border-right:2px solid var(--accent)}td.selection-bottom{border-bottom:2px solid var(--accent)}td.selection-left{border-left:2px solid var(--accent)}td.active-cell{position:relative}table:not(.range-multi) td.active-cell{outline:2px solid var(--accent);outline-offset:-2px;background:var(--cell-bg)}table.range-multi td.active-cell:focus{outline:0}td.search-match{box-shadow:inset 0 0 0 2px #f5b700}td.search-current{box-shadow:inset 0 0 0 3px #f79009;background:#fff7e6}td:focus{outline:2px solid var(--accent);outline-offset:-2px}thead th{position:sticky;top:0;z-index:3;background:var(--panel-strong);text-align:center;border-bottom-color:var(--border-strong)}.row-head{position:sticky;left:0;z-index:2;min-width:46px;width:46px;background:var(--panel-strong);text-align:center;font-weight:400;border-right-color:var(--border-strong)}.corner{left:0;z-index:4!important}th.header-selected{background:var(--accent-soft);color:var(--accent)}.col-resizer,.row-resizer{position:absolute;z-index:9;display:block}.col-resizer{top:0;right:-4px;width:8px;height:100%;cursor:col-resize}.row-resizer{left:0;bottom:-4px;width:100%;height:8px;cursor:row-resize}.resize-guide{position:fixed;z-index:1000;pointer-events:none;background:var(--accent)}.resize-guide.vertical{top:0;bottom:0;width:1px}.resize-guide.horizontal{left:0;right:0;height:1px}.resizing-col,.resizing-col *{cursor:col-resize!important}.resizing-row,.resizing-row *{cursor:row-resize!important}.fill-handle{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;border:1px solid var(--cell-bg);background:var(--accent);z-index:8;cursor:crosshair}.fill-preview{background:var(--accent-soft)!important}.charts-layer{position:absolute;top:10px;right:12px;z-index:9;display:flex;flex-direction:column;gap:8px;pointer-events:none}.chart-card{width:320px;height:220px;padding:10px;border:1px solid var(--border-strong);border-radius:9px;background:var(--cell-bg);box-shadow:0 8px 22px var(--shadow);pointer-events:auto}.chart-head{display:flex;align-items:center;justify-content:space-between;height:24px;font-weight:600}.chart-head button{height:24px;padding:1px 7px}.chart-card svg{width:100%;height:174px;overflow:visible}.chart-empty{display:flex;align-items:center;justify-content:center;height:170px;color:var(--muted)}.structure-context-menu{position:fixed;z-index:80;display:flex;flex-direction:column;gap:3px;min-width:205px;padding:7px;border:1px solid var(--border-strong);border-radius:8px;background:var(--cell-bg);box-shadow:0 10px 28px var(--shadow)}.structure-context-menu[hidden]{display:none!important}.structure-context-menu button{border:0;text-align:left;background:transparent}.structure-context-menu button:hover,.structure-context-menu button:focus-visible{background:var(--panel-strong);outline:0}.operation-toast{position:fixed;left:50%;bottom:52px;z-index:90;max-width:min(520px,calc(100vw - 32px));transform:translateX(-50%);padding:8px 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--cell-bg);box-shadow:0 8px 24px var(--shadow);color:var(--text);pointer-events:none}.operation-toast[data-kind="working"]{color:var(--accent)}.operation-toast[data-kind="warning"]{color:#d97706}.operation-toast[hidden]{display:none!important}
    .tabs{height:40px;display:flex;align-items:center;gap:4px;padding:5px 8px;border-top:1px solid var(--border);background:var(--panel);overflow-x:auto}.tab{padding:6px 14px}.tab.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}.selection-summary{margin-left:auto;padding:0 8px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}.selection-summary:empty{display:none}#app:not(.edit-mode) #add-sheet{display:none}.simple-hint{display:none;margin-left:4px;color:var(--muted);font-size:12px}#app:not(.edit-mode) .simple-hint{display:inline}
    @media(max-width:760px){.search-panel{left:8px;right:8px;width:auto}.selection-summary{position:sticky;right:0;max-width:48vw;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}.simple-hint{display:none!important}}
  </style>
</head>
<body>
  <div id="app">
    <header class="sheet-head"><strong id="document-name" class="document-name" aria-hidden="true">工作簿</strong><span id="mode-label" class="mode-label">简约</span><span id="status">正在加载…</span><button id="mode-toggle" type="button">进入编辑</button></header>
    <div class="commandbar">
      <div class="tool-group"><button id="undo" class="icon-button" disabled title="撤销（Ctrl+Z）" aria-label="撤销"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg></button><button id="redo" class="icon-button" disabled title="重做（Ctrl+Y）" aria-label="重做"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M19 12h-8a6 6 0 0 0-6 6"/></svg></button></div>
      <div class="tool-group edit-only"><select id="number-format" class="compact-select" title="数字格式"><option value="">常规</option><option value="0">整数</option><option value="0.00">两位小数</option><option value="0%">百分比</option><option value="0.00%">百分比 2 位</option><option value="[$¥-804]#,##0.00">人民币</option><option value="yyyy-mm-dd">日期</option></select><button id="bold" class="icon-button" title="加粗">B</button><button id="italic" class="icon-button" title="斜体"><i>I</i></button><button id="underline" class="icon-button" title="下划线"><u>U</u></button><label class="color-tool" title="文字颜色">A<input id="text-color" type="color" value="#202124"></label><label class="color-tool" title="填充颜色">▱<input id="fill-color" type="color" value="#ffffff"></label></div>
      <div class="tool-group"><details class="tool-menu" id="align-menu"><summary title="批量水平对齐" aria-label="批量水平对齐"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M4 6h11M4 10h16M4 14h13M4 18h16"/></svg><svg class="menu-chevron" viewBox="0 0 8 8"><path d="m1 2 3 4 3-4z"/></svg></summary><div class="menu-pop"><button data-align="left" aria-checked="false"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M4 6h11M4 10h16M4 14h9M4 18h16"/></svg>左对齐</button><button data-align="center" aria-checked="false"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M7 6h10M4 10h16M6 14h12M4 18h16"/></svg>居中</button><button data-align="right" aria-checked="false"><svg class="menu-icon" viewBox="0 0 24 24"><path d="M9 6h11M4 10h16M11 14h9M4 18h16"/></svg>右对齐</button></div></details></div>
      <div class="tool-group edit-only"><button id="merge" class="icon-button" title="合并或取消合并" aria-label="合并或取消合并"><svg class="toolbar-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M8 5v14m8-14v14M10 12h4m-2-2v4"/></svg></button><select id="chart-type" class="compact-select" title="图表类型"><option value="bar">柱状图</option><option value="line">折线图</option><option value="pie">饼图</option></select><button id="chart-create" class="icon-button" title="根据选区生成图表" aria-label="生成图表"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M4 20V10h4v10M10 20V4h4v16m2 0v-7h4v7M3 20h18"/></svg></button></div>
      <div class="tool-group preview-tools"><details class="tool-menu" id="text-flow"><summary title="文字换行"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M3 6h12M3 12h15a3 3 0 0 1 0 6h-3m0 0 2-2m-2 2 2 2M3 18h7"/></svg><svg class="menu-chevron" viewBox="0 0 8 8"><path d="m1 2 3 4 3-4z"/></svg></summary><div class="menu-pop"><button data-text-flow="overflow" aria-checked="true">溢出</button><button data-text-flow="cut" aria-checked="false">切断</button><button data-text-flow="wrap" aria-checked="false">换行</button></div></details><details class="tool-menu"><summary title="筛选"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M4 5h16l-6 7v5l-4 2v-7z"/></svg></summary><div class="menu-pop wide-menu"><input id="filter-query" class="filter-input" placeholder="筛选当前列"><button id="filter-apply">应用筛选</button><button id="filter-clear">清除筛选</button></div></details><details class="tool-menu"><summary title="排序"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M7 4v16m0 0-3-3m3 3 3-3M17 20V4m0 0-3 3m3-3 3 3"/></svg><svg class="menu-chevron" viewBox="0 0 8 8"><path d="m1 2 3 4 3-4z"/></svg></summary><div class="menu-pop"><button id="sort-asc">A↓ 升序</button><button id="sort-desc">Z↑ 降序</button></div></details><details class="tool-menu" id="freeze"><summary title="冻结"><svg class="toolbar-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h16M9 4v16"/></svg><svg class="menu-chevron" viewBox="0 0 8 8"><path d="m1 2 3 4 3-4z"/></svg></summary><div class="menu-pop wide-menu"><button id="freeze-clear">取消冻结</button><button id="freeze-row">冻结首行</button><button id="freeze-col">冻结首列</button><button id="freeze-both">冻结首行及首列</button></div></details><button id="search-toggle" class="icon-button" title="查询（Ctrl+F）"><svg class="toolbar-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="12" height="16" rx="1"/><path d="M8 7h6M8 11h4m6 7 3 3m0-3-3 3"/></svg></button></div>
      <div class="tool-group edit-only"><details class="tool-menu" id="structure-menu"><summary title="更多工作表操作" aria-label="更多工作表操作"><svg class="toolbar-icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg></summary><div class="menu-pop wide-menu"><button id="insert-row">＋ 在选中位置上方插入行</button><button id="delete-row" class="danger">－ 删除选中行</button><button id="insert-col">＋ 在选中位置左侧插入列</button><button id="delete-col" class="danger">－ 删除选中列</button><button id="rename">重命名 Sheet</button><button id="delete" class="danger">删除 Sheet</button></div></details></div>
      <div class="tool-group"><button id="export" class="icon-button" title="导出 .xlsx" aria-label="导出 Excel"><svg class="toolbar-icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16"/></svg></button><span class="simple-hint">简约模式可直接编辑并自动保存</span></div>
    </div>
    <div class="formula-row edit-only"><div class="formula-wrap"><input id="name-box" class="name-box" readonly aria-label="当前选区"><span class="fx">fx</span><input id="formula" class="formula-input" aria-label="公式栏" placeholder="输入文字或公式"><datalist id="formula-suggestions"><option value="=SUM()"><option value="=AVERAGE()"><option value="=MIN()"><option value="=MAX()"><option value="=COUNT()"><option value="=ROUND()"><option value="=ABS()"><option value="=IF()"></datalist></div></div><div id="formula-help" class="formula-help edit-only" hidden></div><div id="formula-suggestion-menu" class="formula-suggestion-menu" role="listbox" aria-label="公式候选" hidden></div>
    <aside id="search-panel" class="search-panel" hidden><div class="search-head">查找与替换<button id="search-close" title="关闭">×</button></div><div class="find-wrap"><input id="find" type="search" placeholder="查找当前 Sheet"><span id="find-count" class="find-count"></span><button id="find-prev" title="上一个匹配">上一个</button><button id="find-next" title="下一个匹配">下一个</button></div><div class="replace-wrap"><input id="replace" type="text" placeholder="替换为"><button id="replace-one">替换</button><button id="replace-all">全部替换</button></div><div class="search-options"><label><input id="find-case" type="checkbox">区分大小写</label><label><input id="find-selection" type="checkbox">仅当前选区</label><label><input id="find-formulas" type="checkbox">查找公式原文</label></div></aside>
    <div class="grid-wrap"><table id="grid"></table><div id="charts" class="charts-layer"></div></div>
    <div class="tabs" id="tabs"><button id="add-sheet">＋ 新建 Sheet</button><span id="selection-summary" class="selection-summary" aria-live="polite"></span></div>
  </div>
  <div id="structure-context-menu" class="structure-context-menu" role="menu" hidden><button id="context-structure-insert" role="menuitem">在上方插入 1 行</button><button id="context-structure-delete" class="danger" role="menuitem">删除选中 1 行</button></div>
  <div id="operation-toast" class="operation-toast" role="status" aria-live="polite" hidden></div>
  <script src="./xlsx.full.min.js?v=__PLUGIN_VERSION__"></script>
  <script type="module" src="./sheet-editor.js?v=__PLUGIN_VERSION__-simple7"></script>
</body>
</html>
