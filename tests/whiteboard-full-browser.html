<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Whiteboard full browser test</title></head>
<body data-result="running"><pre id="result">running</pre><iframe id="editor" style="width:1200px;height:720px" src="/plugins/siyuan-cloud-document-suite/whiteboard-editor.html?v=full&amp;asset=%2Fassets%2Ftest.board.json"></iframe>
<script type="module">
const checks = [];
const output = document.querySelector("#result");
const frame = document.querySelector("#editor");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const assert = (condition, message) => { if (!condition) throw new Error(message); };
const pass = (name) => checks.push(name);
const waitUntil = async (predicate, message, timeout = 1000) => {
  const started = performance.now();
  while (!predicate()) {
    if (performance.now() - started > timeout) throw new Error(message);
    await wait(20);
  }
};
const pointer = (type, target, options) => target.dispatchEvent(new PointerEvent(type, { bubbles: true, button: 0, pointerId: 71, ...options }));

try {
  await new Promise((resolve, reject) => {
    frame.addEventListener("load", resolve, { once: true });
    setTimeout(() => reject(new Error("editor load timeout")), 5000);
  });
  await wait(250);
  let doc = frame.contentDocument;
  let win = frame.contentWindow;
  let shell = doc.querySelector("#canvas-shell");
  shell.setPointerCapture = () => {};
  const textEditor = () => doc.querySelector("#text-editor");
  const textEditorInput = () => doc.querySelector("#text-editor-input");
  const renderedNodes = () => [...doc.querySelectorAll("#node-layer [data-node-id]")];
  const selected = () => [...doc.querySelectorAll("#node-layer .selected[data-node-id]")];
  const selectedId = () => selected()[0]?.dataset.nodeId;
  const center = (element) => { const rect = element.getBoundingClientRect(); return { clientX: rect.left + rect.width / 2, clientY: rect.top + rect.height / 2 }; };
  const commitText = async (value) => {
    const editor = textEditor();
    assert(!editor.hidden, "text editor is not open");
    textEditorInput().textContent = value;
    textEditorInput().blur();
    await wait(30);
  };
  const createShape = async (tool, x, y, text) => {
    const before = renderedNodes().length;
    doc.querySelector(`[data-tool="${tool}"]`).click();
    pointer("pointerdown", shell, { clientX: x, clientY: y });
    await waitUntil(() => renderedNodes().length === before + 1, `${tool} was not created exactly once`);
    assert(renderedNodes().length === before + 1, `${tool} was not created exactly once`);
    await waitUntil(() => !textEditor().hidden, `${tool} did not enter editing immediately`);
    assert(getComputedStyle(textEditor()).alignItems === "center", `${tool} editor is not vertically centered`);
    assert(doc.activeElement === textEditorInput(), `${tool} editor did not receive focus`);
    await commitText(text);
    return selectedId();
  };
  const selectNode = async (id, shiftKey = false) => {
    doc.querySelector('[data-tool="select"]').click();
    const node = doc.querySelector(`[data-node-id="${id}"]`);
    const point = center(node);
    pointer("pointerdown", node, { ...point, shiftKey });
    pointer("pointerup", shell, { ...point, shiftKey });
    await wait(20);
  };
  const clearSelection = async () => {
    doc.querySelector('[data-tool="select"]').click();
    pointer("pointerdown", shell, { clientX: 8, clientY: 8 });
    pointer("pointerup", shell, { clientX: 8, clientY: 8 });
    await wait(20);
  };

  shell.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, clientX: 600, clientY: 360 }));
  assert(renderedNodes().length === 0, "blank double click created a node");
  pass("blank-double-click");

  const rectId = await createShape("rect", 270, 230, "矩形");
  const ellipseId = await createShape("ellipse", 520, 230, "椭圆");
  const diamondId = await createShape("diamond", 770, 230, "判断");
  const stickyId = await createShape("sticky", 270, 470, "便签");
  const textId = await createShape("text", 520, 470, "文本");
  assert(new Set([rectId, ellipseId, diamondId, stickyId, textId]).size === 5, "shape ids are not unique");
  pass("shape-create-and-immediate-input");

  await selectNode(rectId);
  assert(selectedId() === rectId && textEditor().hidden, "single click should select without editing");
  const nodeCount = renderedNodes().length;
  let rectNode = doc.querySelector(`[data-node-id="${rectId}"]`);
  rectNode.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, ...center(rectNode) }));
  await wait(30);
  assert(!textEditor().hidden, "double click did not open editor");
  await commitText("双击编辑");
  rectNode = doc.querySelector(`[data-node-id="${rectId}"]`);
  rectNode.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, ...center(rectNode) }));
  await wait(30);
  assert(!textEditor().hidden, "second double click did not reopen editor");
  await commitText("再次编辑");
  assert(renderedNodes().length === nodeCount, "repeated node double click created duplicates");
  pass("single-double-repeat-click");

  await selectNode(rectId);
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "直", bubbles: true }));
  await wait(30);
  assert(textEditorInput().textContent === "直", "direct typing did not replace text");
  await commitText("直接输入");
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await wait(20);
  textEditorInput().textContent = "Enter 编辑";
  textEditorInput().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", ctrlKey: true, bubbles: true }));
  await wait(30);
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "F2", bubbles: true }));
  await wait(20);
  textEditorInput().textContent = "应取消";
  textEditorInput().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
  await wait(30);
  assert(doc.querySelector(`[data-node-id="${rectId}"] .whiteboard-node-text`).textContent === "Enter 编辑", "Escape did not cancel text edit");
  pass("direct-enter-f2-escape-input");

  await selectNode(rectId);
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  await wait(20);
  assert(doc.activeElement === textEditorInput(), "native text editor did not receive focus");
  textEditorInput().textContent = "";
  assert(doc.execCommand("insertText", false, "真实输入已生效"), "browser insertText command was rejected");
  textEditorInput().dispatchEvent(new InputEvent("input", { bubbles: true, inputType: "insertText", data: "真实输入已生效" }));
  textEditorInput().blur();
  await wait(30);
  assert(doc.querySelector(`[data-node-id="${rectId}"] .whiteboard-node-text`).textContent === "真实输入已生效", "browser text insertion was not committed to the node");
  pass("browser-native-text-insertion");

  const imageInput = doc.querySelector("#image-input");
  const transfer = new DataTransfer();
  transfer.items.add(new File(['<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect width="20" height="20" fill="blue"/></svg>'], "test.svg", { type: "image/svg+xml" }));
  Object.defineProperty(imageInput, "files", { configurable: true, value: transfer.files });
  const beforeImage = renderedNodes().length;
  imageInput.dispatchEvent(new Event("change", { bubbles: true }));
  await waitUntil(() => renderedNodes().length === beforeImage + 1 && Boolean(doc.querySelector("#node-layer image")), "image insertion failed", 2000);
  assert(renderedNodes().length === beforeImage + 1 && doc.querySelector("#node-layer image"), "image insertion failed");
  pass("image-create");

  doc.querySelector('[data-tool="pen"]').click();
  pointer("pointerdown", shell, { clientX: 650, clientY: 560 });
  pointer("pointermove", shell, { clientX: 680, clientY: 580 });
  pointer("pointermove", shell, { clientX: 720, clientY: 550 });
  pointer("pointerup", shell, { clientX: 720, clientY: 550 });
  await wait(40);
  assert(doc.querySelector("#node-layer .whiteboard-freehand"), "freehand stroke failed");
  pass("freehand-create");

  await selectNode(rectId);
  const moveNode = doc.querySelector(`[data-node-id="${rectId}"]`);
  const moveRect = moveNode.querySelector("rect");
  const oldX = Number(moveRect.getAttribute("x"));
  const movePoint = center(moveNode);
  pointer("pointerdown", moveNode, movePoint);
  pointer("pointermove", shell, { clientX: movePoint.clientX + 35, clientY: movePoint.clientY + 24 });
  pointer("pointerup", shell, { clientX: movePoint.clientX + 35, clientY: movePoint.clientY + 24 });
  await wait(30);
  assert(Number(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("x")) > oldX, "node move failed");
  const handle = doc.querySelector('[data-resize-handle="se"]');
  const handlePoint = center(handle);
  const oldWidth = Number(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("width"));
  pointer("pointerdown", handle, handlePoint);
  pointer("pointermove", shell, { clientX: handlePoint.clientX + 40, clientY: handlePoint.clientY + 30 });
  pointer("pointerup", shell, { clientX: handlePoint.clientX + 40, clientY: handlePoint.clientY + 30 });
  await wait(30);
  assert(Number(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("width")) > oldWidth, "node resize failed");
  pass("move-resize");

  const beforeManualConnector = doc.querySelectorAll("#node-layer .whiteboard-connector").length;
  doc.querySelector('[data-tool="connector"]').click();
  const manualSource = doc.querySelector(`[data-node-id="${rectId}"]`);
  const manualTarget = doc.querySelector(`[data-node-id="${ellipseId}"]`);
  const sourcePoint = center(manualSource);
  const targetPoint = center(manualTarget);
  pointer("pointerdown", manualSource, sourcePoint);
  pointer("pointermove", shell, targetPoint);
  pointer("pointerup", shell, targetPoint);
  await wait(40);
  assert(doc.querySelectorAll("#node-layer .whiteboard-connector").length === beforeManualConnector + 1, "manual connector failed");
  const lineShape = doc.querySelector("#line-shape");
  lineShape.value = "curve";
  lineShape.dispatchEvent(new Event("change", { bubbles: true }));
  assert(doc.querySelector("#node-layer .whiteboard-connector.selected path:not(.connector-hit)").getAttribute("d").includes(" C "), "connector style failed");
  pass("manual-connector-and-line-style");

  await selectNode(rectId);
  const beforeQuick = renderedNodes().length;
  const quick = doc.querySelector('[data-quick-anchor="right"]');
  pointer("pointerdown", quick, center(quick));
  await wait(40);
  assert(renderedNodes().length === beforeQuick + 2 && !textEditor().hidden, "quick create did not add node and connector");
  await commitText("快捷节点");
  const beforeTab = renderedNodes().length;
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", bubbles: true }));
  await wait(40);
  assert(renderedNodes().length === beforeTab + 2, "Tab quick create failed");
  await commitText("Tab 节点");
  const tabTargetId = selectedId();
  const beforeShiftTab = renderedNodes().length;
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "Tab", shiftKey: true, bubbles: true }));
  await wait(40);
  assert(renderedNodes().length === beforeShiftTab + 2, "Shift+Tab quick create failed");
  await commitText("左侧节点");
  pass("quick-tab-connectors");

  await selectNode(rectId);
  const fill = doc.querySelector("#fill-color");
  fill.value = "#ff0000";
  fill.dispatchEvent(new Event("input", { bubbles: true }));
  fill.dispatchEvent(new Event("change", { bubbles: true }));
  const font = doc.querySelector("#font-size");
  font.value = "24";
  font.dispatchEvent(new Event("change", { bubbles: true }));
  doc.querySelector("#bold").click();
  assert(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("fill") === "#ff0000", "fill style failed");
  assert(doc.querySelector(`[data-node-id="${rectId}"] .whiteboard-node-text`).style.fontSize === "24px", "font size failed");
  pass("styles");

  await clearSelection();
  pointer("pointerdown", shell, { clientX: 80, clientY: 100 });
  pointer("pointermove", shell, { clientX: 1100, clientY: 680 });
  pointer("pointerup", shell, { clientX: 1100, clientY: 680 });
  await wait(30);
  assert(selected().length >= 3, "marquee selection failed");
  pass("marquee-selection");

  await clearSelection();
  await selectNode(rectId);
  await selectNode(ellipseId, true);
  await selectNode(diamondId, true);
  assert(selected().length >= 3, "Shift multi-selection failed");
  const arrange = doc.querySelector("#arrange-action");
  for (const value of ["align-left", "align-center", "align-right", "align-top", "align-middle", "align-bottom", "distribute-horizontal", "distribute-vertical", "auto-horizontal", "auto-vertical", "auto-grid"]) {
    arrange.value = value;
    arrange.dispatchEvent(new Event("change", { bubbles: true }));
  }
  assert(renderedNodes().every((node) => !node.getAttribute("transform")?.includes("NaN")), "arrangement produced invalid geometry");
  pass("align-distribute-auto-layout");

  doc.querySelector("#group").click();
  await wait(20);
  doc.querySelector("#ungroup").click();
  await wait(20);
  doc.querySelector("#group").click();
  doc.querySelector("#create-frame").click();
  await wait(30);
  const frameNode = doc.querySelector("#node-layer .whiteboard-frame");
  assert(frameNode, "frame creation failed");
  const childBefore = Number(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("x"));
  const framePoint = center(frameNode);
  pointer("pointerdown", frameNode, framePoint);
  pointer("pointermove", shell, { clientX: framePoint.clientX + 25, clientY: framePoint.clientY + 15 });
  pointer("pointerup", shell, { clientX: framePoint.clientX + 25, clientY: framePoint.clientY + 15 });
  await wait(30);
  assert(Number(doc.querySelector(`[data-node-id="${rectId}"] rect`).getAttribute("x")) > childBefore, "moving frame did not move children");
  pass("group-ungroup-frame-move");

  await selectNode(rectId);
  const layer = doc.querySelector("#layer-action");
  for (const value of ["front", "backward", "back", "forward"]) {
    layer.value = value;
    layer.dispatchEvent(new Event("change", { bubbles: true }));
  }
  pass("layer-order");

  for (const template of ["flow", "brainstorm", "plan"]) {
    doc.querySelector("#template-button").click();
    doc.querySelector(`[data-template="${template}"]`).click();
    await wait(30);
  }
  assert(doc.querySelectorAll("#node-layer .whiteboard-frame").length >= 4, "project template frames missing");
  pass("all-templates");

  await selectNode(rectId);
  const beforeDuplicate = renderedNodes().length;
  const duplicateSelectionSize = selected().length;
  doc.querySelector("#duplicate").click();
  const afterDuplicate = renderedNodes().length;
  assert(afterDuplicate === beforeDuplicate + duplicateSelectionSize, "duplicate failed");
  doc.querySelector("#undo").click();
  assert(renderedNodes().length === beforeDuplicate, "undo failed");
  doc.querySelector("#redo").click();
  assert(renderedNodes().length === afterDuplicate, "redo failed");
  await selectNode(rectId);
  const clipboardSelectionSize = selected().length;
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "c", ctrlKey: true, bubbles: true }));
  win.dispatchEvent(new KeyboardEvent("keydown", { key: "v", ctrlKey: true, bubbles: true }));
  assert(renderedNodes().length === afterDuplicate + clipboardSelectionSize, "copy/paste failed");
  const beforeDelete = renderedNodes().length;
  const deleteSelectionSize = selected().length;
  doc.querySelector("#delete").click();
  assert(renderedNodes().length === beforeDelete - deleteSelectionSize, "delete failed");
  doc.querySelector("#undo").click();
  assert(renderedNodes().length === beforeDelete, "delete undo failed");
  pass("undo-redo-copy-paste-duplicate-delete");

  const transformBeforePan = doc.querySelector("#viewport-layer").getAttribute("transform");
  doc.querySelector('[data-tool="hand"]').click();
  pointer("pointerdown", shell, { clientX: 900, clientY: 650 });
  pointer("pointermove", shell, { clientX: 940, clientY: 670 });
  pointer("pointerup", shell, { clientX: 940, clientY: 670 });
  assert(doc.querySelector("#viewport-layer").getAttribute("transform") !== transformBeforePan, "canvas pan failed");
  const zoomBefore = doc.querySelector("#zoom-value").textContent;
  doc.querySelector("#zoom-in").click();
  assert(doc.querySelector("#zoom-value").textContent !== zoomBefore, "zoom in failed");
  doc.querySelector("#zoom-out").click();
  const zoomBeforeWheel = doc.querySelector("#zoom-value").textContent;
  shell.dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, ctrlKey: true, deltaY: -120, clientX: 600, clientY: 360 }));
  assert(doc.querySelector("#zoom-value").textContent !== zoomBeforeWheel, "wheel zoom failed");
  doc.querySelector("#fit").click();
  pass("pan-button-wheel-zoom-fit");

  const downloads = [];
  const originalAnchorClick = win.HTMLAnchorElement.prototype.click;
  win.HTMLAnchorElement.prototype.click = function () { downloads.push(this.download); };
  doc.querySelector("#export-svg").click();
  await wait(50);
  assert(downloads.some((name) => name.endsWith(".svg")), "SVG export failed");
  doc.querySelector("#export-png").click();
  for (let index = 0; index < 20 && !downloads.some((name) => name.endsWith(".png")); index += 1) await wait(100);
  assert(downloads.some((name) => name.endsWith(".png")), "PNG export failed");
  win.HTMLAnchorElement.prototype.click = originalAnchorClick;
  pass("svg-png-export");

  win.dispatchEvent(new KeyboardEvent("keydown", { key: "s", ctrlKey: true, bubbles: true }));
  await wait(1100);
  const saved = await fetch("/assets/test.board.json", { cache: "no-store" }).then((response) => response.json());
  assert(saved.nodes.length === renderedNodes().length, "saved node count differs from rendered count");
  assert(saved.nodes.some((node) => node.type === "frame"), "frames were not saved");
  assert(saved.nodes.some((node) => node.groupId), "groups were not saved");
  assert(saved.nodes.every((node) => node.type === "connector" || node.type === "freehand" || (Number.isFinite(node.x) && Number.isFinite(node.y))), "saved geometry is invalid");
  const savedCount = saved.nodes.length;
  frame.src = frame.src + "&reload=1";
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  await wait(300);
  doc = frame.contentDocument;
  assert(doc.querySelectorAll("#node-layer [data-node-id]").length === savedCount, "reload did not restore all nodes");
  pass("save-reload");

  document.body.dataset.result = "passed";
  output.textContent = `WHITEBOARD_FULL_BROWSER_PASSED: ${checks.join(", ")}`;
  await fetch("/full-result", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ status: "passed", checks }) });
} catch (error) {
  document.body.dataset.result = "failed";
  output.textContent = `WHITEBOARD_FULL_BROWSER_FAILED: ${error.stack || error}`;
  await fetch("/full-result", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ status: "failed", checks, error: String(error.stack || error) }) });
}
</script></body></html>
