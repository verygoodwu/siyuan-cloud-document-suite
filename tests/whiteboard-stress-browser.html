<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Whiteboard 30-minute stress test</title></head>
<body><pre id="result">preparing 30-minute stress test</pre><iframe id="editor" style="width:1200px;height:720px"></iframe>
<script type="module">
const params = new URLSearchParams(location.search);
const durationMs = Number(params.get("durationMs")) || 30 * 60 * 1000;
const output = document.querySelector("#result");
const frame = document.querySelector("#editor");
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const pointer = (type, target, options = {}) => target.dispatchEvent(new PointerEvent(type, {
  bubbles: true, cancelable: true, button: 0, buttons: type === "pointerup" ? 0 : 1, pointerId: 813, ...options
}));
const errors = [];
window.addEventListener("error", (event) => errors.push(String(event.error || event.message)));
window.addEventListener("unhandledrejection", (event) => errors.push(String(event.reason)));

async function report(value) {
  await fetch("/stress-result", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(value) });
}

try {
  await fetch("/test-seed-large", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ count: 120 }) });
  frame.src = "/plugins/siyuan-cloud-document-suite/whiteboard-editor.html?v=stress&asset=%2Fassets%2Ftest.board.json";
  await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const shell = doc.querySelector("#canvas-shell");
  shell.setPointerCapture = () => {};
  while (doc.querySelectorAll("#node-layer [data-node-id]").length !== 120) await wait(20);
  const startedAt = performance.now();
  const memoryStart = performance.memory?.usedJSHeapSize || null;
  let memoryMax = memoryStart;
  let operations = 0;
  let saves = 0;
  let heartbeatMaxMs = 0;
  let lastHeartbeat = performance.now();

  while (performance.now() - startedAt < durationMs) {
    const index = operations % 120;
    const node = doc.querySelector(`[data-node-id="perf-${index}"]`);
    if (!node) throw new Error(`stress node perf-${index} missing`);
    const rect = node.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    pointer("pointerdown", node, { clientX: x, clientY: y });
    pointer("pointermove", shell, { clientX: x + 8 + (operations % 5), clientY: y + (operations % 7) - 3 });
    pointer("pointerup", shell, { clientX: x + 8 + (operations % 5), clientY: y + (operations % 7) - 3 });
    shell.dispatchEvent(new WheelEvent("wheel", { bubbles: true, cancelable: true, ctrlKey: true, deltaY: operations % 2 ? 8 : -8, clientX: 600, clientY: 360 }));
    win.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, ctrlKey: true, key: "z" }));
    win.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, ctrlKey: true, shiftKey: true, key: "z" }));
    if (operations % 5 === 0) {
      win.dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, ctrlKey: true, key: "s" }));
      saves += 1;
    }
    operations += 1;
    await new Promise((resolve) => requestAnimationFrame(resolve));
    const now = performance.now();
    heartbeatMaxMs = Math.max(heartbeatMaxMs, now - lastHeartbeat);
    lastHeartbeat = now;
    const memory = performance.memory?.usedJSHeapSize || null;
    if (memory != null) memoryMax = Math.max(memoryMax || 0, memory);
    if (operations % 250 === 0) {
      const progress = {
        status: "running", operations, saves,
        elapsedMs: Math.round(now - startedAt), durationMs,
        memoryStart, memoryCurrent: memory, memoryMax,
        errors: errors.slice(-10)
      };
      output.textContent = JSON.stringify(progress, null, 2);
      await report(progress);
    }
  }
  await wait(1200);
  const memoryEnd = performance.memory?.usedJSHeapSize || null;
  const memoryGrowth = memoryStart && memoryEnd ? memoryEnd - memoryStart : null;
  const metrics = { durationMs: Math.round(performance.now() - startedAt), operations, saves, memoryStart, memoryMax, memoryEnd, memoryGrowth, heartbeatMaxMs };
  if (errors.length) throw new Error(`uncaught errors: ${errors.join(" | ")}`);
  if (doc.querySelectorAll("#node-layer [data-node-id]").length !== 120) throw new Error("node count changed during stress run");
  if (heartbeatMaxMs > 5000) throw new Error(`test page was suspended or unresponsive for ${heartbeatMaxMs}ms`);
  if (memoryGrowth != null && memoryGrowth > Math.max(64 * 1024 * 1024, memoryStart * 0.75)) throw new Error(`heap growth too large: ${memoryGrowth}`);
  output.textContent = `WHITEBOARD_30_MIN_STRESS_PASSED ${JSON.stringify(metrics, null, 2)}`;
  await report({ status: "passed", metrics });
} catch (error) {
  output.textContent = `WHITEBOARD_30_MIN_STRESS_FAILED ${error.stack || error}`;
  await report({ status: "failed", errors, error: String(error.stack || error) });
}
</script></body></html>
